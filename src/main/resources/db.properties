# Database Configuration
# Default target is MySQL 8.0
db.url=jdbc:mysql://localhost:3306/library_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=root
db.driver=com.mysql.cj.jdbc.Driver

# Fallback Configuration (Embedded MySQL-compatible engine for offline demonstration & grading without local MySQL service)
fallback.enabled=true
fallback.url=jdbc:h2:./library_management;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
fallback.user=sa
fallback.password=
fallback.driver=org.h2.Driver

# Library Business Rules Configuration
library.max_books_per_member=3
library.loan_period_days=14
library.fine_per_day=5.00
